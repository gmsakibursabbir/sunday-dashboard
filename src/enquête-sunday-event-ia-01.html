  <div class="w-full max-w-[402px] mx-auto  flex flex-col">
    <!-- Header Logo -->
    <header class="flex justify-start py-[10px] w-full bg-white px-4">
      <img src="./images/logos.png" alt="Sunday Events" class="h-[35px] object-contain">
    </header>

    <main class="flex flex-col gap-5 px-4 pt-[10px]">
      <!-- Image Hero -->
      <div class="relative w-full rounded-[16px] overflow-hidden shadow-sm h-[172px]">
        <img src="./images/sunday-gp-img.png" alt="Concert" class="absolute inset-0 w-full h-full object-cover">
        <div class="absolute inset-0 bg-[#350211]/30"></div>
        <div class="absolute inset-0 bg-gradient-to-t from-[#1F0008]/80 via-[#1F0008]/40 to-transparent"></div>

        <div class="absolute inset-0 flex flex-col justify-end items-center p-6 text-center z-10 pb-4">
          <h2 class="text-white font-poppins font-bold text-[17px] leading-[23px] tracking-[-0.17px] mb-1">Merci pour
            votre participation !
          </h2>
          <p class="text-white/90 font-poppins text-[15px] leading-[19px] tracking-[-0.14px]">Évaluez votre expérience
            au Festival<br>Afro
            Music 2026</p>
        </div>
      </div>

      <!-- Satisfaction Card -->
      <div
        class="bg-white rounded-[16px] p-5 shadow-[0px_2px_8px_0px_rgba(0,0,0,0.04)] border border-[#E8E8E9] flex flex-col items-center gap-[14px] mt-1">

          <div class="flex flex-col items-center gap-2 cursor-pointer group emoji-item relative transition-transform"

            <span

  <script src="./js/index.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const emojiItems = document.querySelectorAll('.emoji-item');
      const satisfactionText = document.getElementById('satisfaction-text');
      const submitBtn = document.getElementById('submit-btn');
      let emojiSelected = false;

      function checkFormReady() {
        const anyStarRated = [...document.querySelectorAll('.star-group')].some(g => parseInt(g.dataset.rating || '0') > 0);
        if (emojiSelected || anyStarRated) {
          submitBtn.disabled = false;
          submitBtn.style.backgroundColor = '#22C55E';
          submitBtn.style.boxShadow = '0px 4px 12px rgba(34,197,94,0.3)';
          submitBtn.style.cursor = 'pointer';
        }
      }

      emojiItems.forEach(item => {
        item.addEventListener('click', () => {
          // Reset all
          emojiItems.forEach(el => {
            const circle = el.querySelector('.emoji-circle');
            const number = el.querySelector('.emoji-number');

            circle.style.backgroundColor = '#F9FAFA';
            circle.style.borderColor = 'transparent';
            circle.style.transform = 'scale(1)';
            circle.classList.remove('shadow-lg');

            number.style.color = '#898F8F';
            number.classList.remove('font-bold');
            number.classList.add('font-semibold');
          });

          // Set selected
          const circle = item.querySelector('.emoji-circle');
          const number = item.querySelector('.emoji-number');
          const color = item.getAttribute('data-color');
          const bg = item.getAttribute('data-bg');
          const label = item.getAttribute('data-label');

          circle.style.backgroundColor = bg;
          circle.style.borderColor = color;
          circle.style.boxShadow = '';
          circle.classList.add('shadow-lg');
          circle.style.transform = 'scale(1.05)';

          number.style.color = color;
          number.classList.remove('font-semibold');
          number.classList.add('font-bold');

          satisfactionText.textContent = label;
          satisfactionText.style.color = color;
          document.getElementById('satisfaction-text-wrapper').style.display = 'flex';
          emojiSelected = true;
          checkFormReady();
        });
      });

      // ── Star rating ──────────────────────────────────────────────
      const FILLED_PATH = 'M9.60306 1.91274C9.63958 1.83895 9.696 1.77685 9.76594 1.73342C9.83588 1.69 9.91657 1.66699 9.9989 1.66699C10.0812 1.66699 10.1619 1.69 10.2319 1.73342C10.3018 1.77685 10.3582 1.83895 10.3947 1.91274L12.3197 5.8119C12.4465 6.06854 12.6337 6.29058 12.8652 6.45895C13.0968 6.62732 13.3657 6.737 13.6489 6.77857L17.9539 7.40857C18.0355 7.42039 18.1121 7.4548 18.1751 7.5079C18.2382 7.56101 18.2851 7.63069 18.3106 7.70908C18.3361 7.78746 18.3391 7.87141 18.3194 7.95143C18.2996 8.03146 18.2579 8.10436 18.1989 8.1619L15.0856 11.1936C14.8802 11.3937 14.7266 11.6406 14.6379 11.9133C14.5492 12.1859 14.5281 12.476 14.5764 12.7586L15.3114 17.0419C15.3258 17.1234 15.317 17.2074 15.286 17.2841C15.255 17.3609 15.203 17.4274 15.136 17.4761C15.069 17.5247 14.9897 17.5536 14.9071 17.5593C14.8245 17.5651 14.742 17.5475 14.6689 17.5086L10.8206 15.4852C10.567 15.3521 10.2849 15.2825 9.99848 15.2825C9.71208 15.2825 9.42996 15.3521 9.1764 15.4852L5.3289 17.5086C5.25584 17.5472 5.17339 17.5646 5.09094 17.5588C5.00848 17.5529 4.92933 17.524 4.86247 17.4754C4.79562 17.4268 4.74376 17.3604 4.71278 17.2838C4.6818 17.2071 4.67294 17.1233 4.68723 17.0419L5.4214 12.7594C5.46989 12.4767 5.44888 12.1864 5.36018 11.9136C5.27147 11.6408 5.11774 11.3937 4.91223 11.1936L1.7989 8.16274C1.73939 8.10526 1.69722 8.03223 1.6772 7.95197C1.65717 7.8717 1.66009 7.78742 1.68563 7.70873C1.71116 7.63004 1.75828 7.5601 1.82163 7.50689C1.88497 7.45367 1.96198 7.41932 2.0439 7.40774L6.34806 6.77857C6.63161 6.73732 6.90089 6.62778 7.13272 6.45939C7.36454 6.291 7.55198 6.0688 7.6789 5.8119L9.60306 1.91274Z';

      function updateStars(group, rating) {
        group.querySelectorAll('.star-icon').forEach(star => {
          const val = parseInt(star.getAttribute('data-star'));
          const path = star.querySelector('path');
          if (val <= rating) {
            path.setAttribute('fill', '#F59E0B');
            path.setAttribute('stroke', '#F59E0B');
          } else {
            path.setAttribute('fill', 'none');
            path.setAttribute('stroke', '#D1D5DB');
          }
        });
      }

      document.querySelectorAll('.star-group').forEach(group => {
        const stars = group.querySelectorAll('.star-icon');

        stars.forEach(star => {
          // Hover preview
          star.addEventListener('mouseenter', () => {
            const hoverVal = parseInt(star.getAttribute('data-star'));
            stars.forEach(s => {
              const v = parseInt(s.getAttribute('data-star'));
              const p = s.querySelector('path');
              if (v <= hoverVal) {
                p.setAttribute('fill', '#F59E0B');
                p.setAttribute('stroke', '#F59E0B');
              } else {
                p.setAttribute('fill', 'none');
                p.setAttribute('stroke', '#D1D5DB');
              }
            });
          });

          // Restore to saved rating on mouse leave
          star.addEventListener('mouseleave', () => {
            const saved = parseInt(group.dataset.rating || '0');
            updateStars(group, saved);
          });

          // Click to set rating
          star.addEventListener('click', () => {
            const val = parseInt(star.getAttribute('data-star'));
            group.dataset.rating = val;
            updateStars(group, val);
            checkFormReady();
          });
        });
      });
    });
  </script>
